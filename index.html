<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bill Search</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #121212;
            color: #e0e0e0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        header {
            margin-top: 50px;
            margin-bottom: 30px;
            text-align: center;
        }

        h1 {
            font-size: 3rem;
            color: #4da6ff;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        p {
            color: #888;
            font-size: 1rem;
        }

        .search-container {
            width: 100%;
            max-width: 700px;
            background: #1e1e1e;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }

        /* Προσαρμογή εμφάνισης του Google Search Widget */
        .gsc-control-cse {
            background-color: transparent !important;
            border: none !important;
            padding: 0 !important;
        }

        .gsc-search-button-v2 {
            background-color: #4da6ff !important;
            border-radius: 6px !important;
        }

        input.gsc-input {
            background-color: #2a2a2a !important;
            color: #ffffff !important;
            border-radius: 6px !important;
            border: 1px solid #333 !important;
        }

        .gsc-webResult.gsc-result {
            background-color: #1e1e1e !important;
            border-bottom: 1px solid #2a2a2a !important;
        }

        .gs-title b, .gs-title {
            color: #82b1ff !important;
        }

        .gs-snippet {
            color: #ccc !important;
        }
    </style>
</head>
<body>

    <header>
        <h1>Bill Search</h1>
        <p>Η δική σου προσαρμοσμένη μηχανή αναζήτησης</p>
    </header>

    <div class="search-container">
        <!-- Εδώ φορτώνει η μηχανή αναζήτησης της Google -->
        <script async src="https://cse.google.com/cse.js?cx=969b54edec37c4ed1"></script>
        <div class="gcse-search"></div>
    </div>

</body>
</html>
