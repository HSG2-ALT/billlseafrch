<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bill Search</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --border-color: rgba(255, 255, 255, 0.1);
            --accent-gradient: linear-gradient(135deg, #38bdf8 0%, #818cf8 50%, #c084fc 100%);
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            position: relative;
        }

        .glow {
            position: absolute;
            top: 15%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 500px;
            height: 250px;
            background: radial-gradient(circle, rgba(56, 189, 248, 0.15) 0%, rgba(0,0,0,0) 70%);
            filter: blur(60px);
            z-index: 0;
            pointer-events: none;
        }

        .container {
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 1;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
        }

        .logo {
            font-size: 3.5rem;
            font-weight: 800;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -1px;
            margin-bottom: 8px;
        }

        .subtitle {
            color: var(--text-sub);
            font-size: 0.95rem;
        }

        /* Shortcuts */
        .shortcuts {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            justify-content: center;
        }

        .shortcut-btn {
            background: rgba(30, 41, 59, 0.8);
            color: #cbd5e1;
            border: 1px solid var(--border-color);
            padding: 8px 16px;
            border-radius: 20px;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .shortcut-btn:hover {
            background: #334155;
            color: #ffffff;
            border-color: #38bdf8;
            transform: translateY(-2px);
        }

        /* Search Box Wrapper */
        .search-wrapper {
            width: 100%;
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        }

        /* Google CSE Overrides */
        .gsc-control-cse {
            background-color: transparent !important;
            border: none !important;
            padding: 0 !important;
        }

        input.gsc-input {
            background-color: #0f172a !important;
            color: #ffffff !important;
            border-radius: 8px !important;
            border: 1px solid #334155 !important;
            padding: 10px 14px !important;
        }

        .gsc-search-button-v2 {
            background: var(--accent-gradient) !important;
            border-radius: 8px !important;
            border: none !important;
            padding: 10px 16px !important;
        }

        .gsc-webResult.gsc-result {
            background-color: rgba(15, 23, 42, 0.6) !important;
            border: 1px solid var(--border-color) !important;
            border-radius: 10px !important;
            margin-top: 10px !important;
            padding: 14px !important;
        }

        .gs-title, .gs-title b {
            color: #38bdf8 !important;
            text-decoration: none !important;
        }

        .gs-snippet {
            color: #cbd5e1 !important;
        }

        footer {
            margin-top: auto;
            padding-top: 30px;
            color: #64748b;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>

    <div class="glow"></div>

    <div class="container">
        <header>
            <div class="logo">Bill Search</div>
            <div class="subtitle">Custom Search Engine</div>
        </header>

        <div class="shortcuts">
            <a href="https://github.com" target="_blank" class="shortcut-btn">GitHub</a>
            <a href="https://youtube.com" target="_blank" class="shortcut-btn">YouTube</a>
            <a href="https://chatgpt.com" target="_blank" class="shortcut-btn">ChatGPT</a>
        </div>

        <div class="search-wrapper">
            <script async src="https://cse.google.com/cse.js?cx=969b54edec37c4ed1"></script>
            <div class="gcse-search"></div>
        </div>
    </div>

    <footer>
        &copy; 2026 Bill Search
    </footer>

</body>
</html>
